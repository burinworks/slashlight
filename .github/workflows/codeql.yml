name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
      - run: swift build
      - uses: github/codeql-action/analyze@v3
