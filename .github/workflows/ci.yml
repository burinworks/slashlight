name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (debug)
        run: swift build

      - name: Test
        run: scripts/test.sh

      - name: Build app bundle (universal)
        run: UNIVERSAL=1 VERSION=0.0.0-ci BUILD_NUMBER=${{ github.run_number }} scripts/build-app.sh

      - name: Smoke test
        run: |
          plutil -lint build/Slashlight.app/Contents/Info.plist
          lipo -archs build/Slashlight.app/Contents/MacOS/Slashlight
          codesign --verify --verbose build/Slashlight.app

      - name: Disk image
        run: scripts/make-dmg.sh build/Slashlight.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Slashlight-${{ github.sha }}
          path: build/Slashlight.dmg
          retention-days: 14

  server:
    name: Statistics server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m unittest discover -s server/tests -v
      - name: Docker image builds
        run: docker build -t slashlight-stats server
