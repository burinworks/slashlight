name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Test
        run: scripts/test.sh

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER=${{ github.run_number }} UNIVERSAL=1 \
            TELEMETRY_URL="${{ vars.TELEMETRY_URL }}" scripts/build-app.sh
          scripts/make-dmg.sh "dist/Slashlight-${GITHUB_REF_NAME}.dmg"
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt \
            --title "Slashlight $GITHUB_REF_NAME" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
