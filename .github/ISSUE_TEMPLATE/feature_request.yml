name: Feature request
description: Suggest a new extension or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the solution. "I keep switching to Finder to…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work?
      description: What would you type, and what would you see?
  - type: dropdown
    id: scope
    attributes:
      label: Could this be an external extension?
      options:
        - "Yes, it only needs the extension protocol"
        - "No, it needs a change to the app"
        - "Not sure"
